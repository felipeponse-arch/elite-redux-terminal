name: CI

# Roda todos os testes num Chromium headless via Playwright (@playwright/test,
# fase 6 da refatoração, 2026-09-24), contra o MESMO artifact_final.html que
# seria publicado - sem isso, nada garantia que os testes passassem antes de um
# publish (achado real da auditoria completa da equipe, 2026-09-13).
#
# -SkipExtract de propósito: build.ps1 sem essa flag roda check_upstream.ps1
# (chamada de rede pro NextDex oficial) - isso é uma preocupação separada
# (dado desatualizado), não "o código atual funciona", e tornaria o CI
# flaky por causa de rede externa em toda run. O check de drift periódico
# é uma tarefa própria (scripts/check_upstream.ps1), não este workflow.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # npm ci instala exatamente o que está no package-lock.json - npm install
      # podia resolver versões diferentes das testadas localmente.
      - name: Instala dependências do CI (Playwright)
        run: npm ci

      # Etapa 1 da pauta técnica (S2): dependência com vulnerabilidade alta ou
      # crítica bloqueia o CI. As dependências são só do processo de teste,
      # nunca do artifact publicado.
      - name: Auditoria de dependências (npm audit)
        run: npm audit --audit-level=high

      # Fase 1 da refatoração (2026-09-24): acento corrompido, .ps1 sem BOM (o
      # PowerShell 5.1 corrompe o acento e isso já errou 16 notas do rank) e
      # erro de sintaxe (inclusive no JS de dentro do template), ESLint só com
      # regras de correção e checagem de tipos de src/regras (tsc, checkJs).
      - name: Travas estáticas (codificação, sintaxe, lint, tipos)
        run: npm run check

      # Etapa 2 da pauta técnica (Q3): regras do jogo testadas no Node, sem
      # build nem navegador - falha em segundos, antes dos minutos de Chromium.
      - name: Testes unitários das regras (src/regras)
        run: npm run test:unit

      # Q5: cada defeito do catálogo (tests/unit/mutacoes.mjs) tem que derrubar
      # algum teste unitário - defeito que sobrevive = regra sem proteção.
      - name: Teste de sabotagem das regras
        run: npm run test:sabotage

      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Builda artifact_final.html (reusa data/*.json já commitado)
        run: powershell -NoProfile -File scripts/build.ps1 -SkipExtract

      # O Playwright sobe sozinho o servidor de testes (webServer em
      # playwright.config.mjs). Um comando só: cada seção da suíte sozinha em
      # navegador limpo + a sequência completa, cenários com recarga, fuzz de
      # saves e sincronização entre aparelhos. No CI: uma nova tentativa por
      # teste, e o que só passa na segunda aparece como "flaky" no relatório.
      - name: Testes de navegador (Playwright)
        run: npm run test:e2e

      # Não bloqueia: as imagens de referência são geradas no Windows local, e
      # o runner do GitHub renderiza fonte com antialiasing diferente - falha
      # aqui é sinal pra olhar as imagens, não prova de regressão.
      - name: Regressão visual (informativa)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run test:visual

      # Relatório HTML + prints, traces e diferenças visuais de cada falha.
      - name: Guarda o relatório dos testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            playwright-report-visual/
            test-results/
            test-results-visual/
          if-no-files-found: ignore
          retention-days: 14
