name: CI

# Roda todas as travas e testes contra o MESMO artifact_final.html que seria
# publicado - sem isso, nada garantia que os testes passassem antes de um
# publish (achado real da auditoria completa da equipe, 2026-09-13).
#
# Linux desde a fase 8 da refatoração (2026-09-24): build (scripts/build.mjs),
# servidor de testes e travas são Node - nada aqui depende mais do Windows.
# O build só MONTA o app a partir dos data/*.json versionados; a extração do
# dado bruto (scripts/build.ps1, rede pro NextDex) fica fora de propósito -
# dado desatualizado é outra preocupação (scripts/check_upstream.ps1) e rede
# externa em toda execução deixaria o CI instável.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: {}

# Um push novo no mesmo ramo cancela a execução anterior, que ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Meta (06/11/2026): CI inteiro em até ~10 min. Dois jobs em paralelo, cada um com teto de tempo:
#   rapido    - travas, unitários rápidos, build (a sabotagem completa roda na rodada semanal "Pesado", não no PR)
#   navegador - build + Playwright
# Os testes pesados (tests/pesados.json) e a sabotagem a frio ficam no workflow "Pesado" (semanal/manual).
jobs:
  rapido:
    runs-on: ubuntu-24.04 # fixo: ubuntu-latest já aponta para o Ubuntu 26 e o apt do Playwright travou (11/11/2026)
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Instala dependências
        run: npm ci
      - name: Auditoria de dependências (npm audit)
        run: npm audit --audit-level=high
      - name: Travas estáticas
        run: npm run check
      # Build antes dos unitários: 2 testes (fontes) leem artifact_final.html, que não é versionado.
      - name: Build
        run: npm run build
      - name: Testes unitários rápidos
        run: ER_SEM_TS=1 npm run test:unit

  navegador:
    runs-on: ubuntu-24.04 # fixo: ubuntu-latest já aponta para o Ubuntu 26 e o apt do Playwright travou (11/11/2026)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Cache do navegador do Playwright
        id: cache-navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instala o Chromium do Playwright
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependências de sistema do Chromium (navegador veio do cache)
        if: steps.cache-navegador.outputs.cache-hit == 'true'
        # 11/11/2026: o espelho do apt (azure.archive.ubuntu.com) saiu do ar e o passo travou 10 min. Os runners já trazem as
        # bibliotecas do Chromium; este passo só reforça. Sem rede ele vence o tempo e segue: se faltar biblioteca, o teste de navegador acusa.
        timeout-minutes: 3
        continue-on-error: true
        run: npx playwright install-deps chromium
      - name: Testes de navegador (Playwright)
        run: npm run test:e2e
      - name: Guarda o relatório (só se falhar)
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
